<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Coming Soon · BackDEV</title>
  <meta name="description" content="Coming Soon · BackDEV Industrial Mission Control" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    :root {
      --bg: #070b14;
      --bg-mono: #050608;
      --bg2: #0c1322;
      --card: rgba(12, 19, 34, 0.75);
      --border: rgba(56, 189, 248, 0.2);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --neon: #00f5ff;
      --neon2: #3b82f6;
      --amber: #f59e0b;
      --emerald: #10b981;
      --text: #f8fafc;
      --text2: #cbd5e1;
      --text-muted: #94a3b8;
      --glow: 0 0 35px rgba(0, 245, 255, 0.22);
      --glow-amber: 0 0 30px rgba(245, 158, 11, 0.25);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      cursor: none !important;
    }

    @media (pointer: coarse),
    (hover: none) {

      *,
      *::before,
      *::after {
        cursor: auto !important;
      }

      #cursor,
      #cursor-ring {
        display: none !important;
      }
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background: var(--bg-mono);
      color: var(--text);
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      transition: background-color 700ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    body.is-prismatic {
      background: var(--bg);
    }

    /* Cyber Background & Legacy Ambient Bloom (Monochrome <-> Prismatic Sync) */
    .viewport-container {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background-color: var(--bg-mono);
      background-image:
        radial-gradient(circle at 50% 45%, rgba(255, 255, 255, 0.055) 0%, transparent 60%),
        radial-gradient(circle at 15% 15%, rgba(226, 232, 240, 0.045) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(203, 213, 225, 0.03) 0%, transparent 40%);
      transition: background-color 700ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    .viewport-container::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        radial-gradient(circle at 50% 45%, rgba(0, 245, 255, 0.09) 0%, transparent 60%),
        radial-gradient(circle at 15% 15%, rgba(59, 130, 246, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(245, 158, 11, 0.05) 0%, transparent 40%);
      opacity: 0;
      transition: opacity 700ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    body.is-prismatic .viewport-container {
      background-color: var(--bg);
    }

    body.is-prismatic .viewport-container::after {
      opacity: 1;
    }

    /* Legacy Subtle Cyber Tech Grid (48x48px, Monochrome <-> Prismatic Sync) */
    .grid-backdrop {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.032) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.032) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 1;
      -webkit-mask-image: radial-gradient(circle at 50% 50%, black 40%, transparent 85%);
      mask-image: radial-gradient(circle at 50% 50%, black 40%, transparent 85%);
    }

    .grid-backdrop::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(56, 189, 248, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.035) 1px, transparent 1px);
      background-size: 48px 48px;
      opacity: 0;
      transition: opacity 700ms cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }

    body.is-prismatic .grid-backdrop::after {
      opacity: 1;
    }

    /* Legacy Interactive Particle Mesh Canvas (Optimized, Single rAF Loop) */
    #particle-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
      opacity: 0;
      transition: opacity 900ms ease-out;
    }

    #particle-canvas.is-ready {
      opacity: 1;
    }

    /* Legacy Subtle Scanline Overlay */
    .scanline-overlay {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg,
          transparent,
          transparent 2px,
          rgba(255, 255, 255, 0.013) 2px,
          rgba(255, 255, 255, 0.013) 4px);
      pointer-events: none;
      z-index: 3;
    }

    body.is-prismatic .scanline-overlay {
      background: repeating-linear-gradient(0deg,
          transparent,
          transparent 2px,
          rgba(0, 245, 255, 0.018) 2px,
          rgba(0, 245, 255, 0.018) 4px);
    }

    /* WebGL Optical Card Backlight Layer (Transparent Over Legacy Particle/Grid Background) */
    /* ARCHIVED NOTE: Previously rendered unified Micro-LED Light Field + Backlight at z-index: 1 */
    #ambient-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 4;
      opacity: 0;
      transition: opacity 900ms ease-out;
    }

    #ambient-canvas.is-ready {
      opacity: 1;
    }

    /* ── HUD Telemetry Frames (Corners & Edges) ────────── */
    .hud-edge {
      position: absolute;
      z-index: 5;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      color: rgba(186, 192, 202, 0.58);
      user-select: none;
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: color 700ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    body.is-prismatic .hud-edge {
      color: rgba(148, 163, 184, 0.65);
    }

    .hud-tl {
      top: 1.5rem;
      left: 1.75rem;
    }

    .hud-tr {
      top: 1.5rem;
      right: 1.75rem;
    }

    .hud-bl {
      bottom: 1.5rem;
      left: 1.75rem;
    }

    .hud-br {
      bottom: 1.5rem;
      right: 1.75rem;
    }

    .hud-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #e2e8f0;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.75);
      animation: pulseNeon 2s infinite ease-in-out;
      transition: background-color 700ms cubic-bezier(0.4, 0, 0.2, 1), box-shadow 700ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    body.is-prismatic .hud-dot {
      background: var(--neon);
      box-shadow: 0 0 10px var(--neon);
    }

    @keyframes pulseNeon {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.35;
        transform: scale(0.85);
      }
    }

    .hud-live-tag {
      color: #f8fafc;
      font-weight: 600;
      transition: color 700ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    body.is-prismatic .hud-live-tag {
      color: var(--neon);
    }

    /* ── Center Stage & Perspective Wrapper ───────────── */
    .stage-wrapper {
      position: relative;
      z-index: 10;
      perspective: 1200px;
      max-width: 680px;
      width: 100%;
    }

    /* ── 3D Tilt Rig (Synced With Shader Homography) ──── */
    .card-tilt-rig {
      position: relative;
      width: 100%;
      transform-origin: 50% 50%;
      will-change: transform;
    }

    /* ── Main Bento Obsidian Card (Opaque + Matte Grain) ─ */
    .coming-card {
      position: relative;
      z-index: 2;
      isolation: isolate;
      overflow: hidden;
      width: 100%;
      background: #06070a;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 32px;
      padding: 4.5rem 3rem 4rem;
      box-shadow:
        0 24px 64px -20px rgba(0, 0, 0, 0.85),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 2.2rem;
      transition:
        background-color 0.7s cubic-bezier(0.4, 0, 0.2, 1),
        border-color 0.7s cubic-bezier(0.4, 0, 0.2, 1),
        box-shadow 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .coming-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      z-index: -2;
      opacity: 0.036;
      background-image: var(--card-grain-url, none);
      background-size: 128px 128px;
      background-repeat: repeat;
    }

    .coming-card.is-prismatic {
      background: #060910;
      border-color: rgba(255, 255, 255, 0.16);
      box-shadow:
        0 24px 64px -20px rgba(0, 0, 0, 0.85),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    /* Interactive Spotlight Layer (Compositor translate3d Only) */
    .card-spotlight {
      position: absolute;
      top: 0;
      left: 0;
      width: 560px;
      height: 560px;
      margin-left: -280px;
      margin-top: -280px;
      border-radius: 50%;
      pointer-events: none;
      z-index: -1;
      opacity: 0;
      transform: translate3d(340px, 210px, 0);
      background: radial-gradient(circle at center,
          rgba(255, 255, 255, 0.048) 0%,
          rgba(255, 255, 255, 0.015) 38%,
          transparent 66%);
      transition: opacity 0.35s ease;
      will-change: transform;
    }

    .card-spotlight.is-visible {
      opacity: 1;
    }

    .card-spotlight::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(circle at center,
          rgba(0, 245, 255, 0.08) 0%,
          rgba(59, 130, 246, 0.025) 40%,
          transparent 68%);
      opacity: 0;
      transition: opacity 700ms cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }

    .coming-card.is-prismatic .card-spotlight::after {
      opacity: 1;
    }

    /* Sci-Fi HUD Corner Brackets */
    .corner-bracket {
      position: absolute;
      width: 14px;
      height: 14px;
      pointer-events: none;
      border-color: rgba(255, 255, 255, 0.28);
      transition: border-color 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .coming-card.is-prismatic .corner-bracket {
      border-color: rgba(0, 245, 255, 0.72);
    }

    .corner-bracket.tl {
      top: 12px;
      left: 12px;
      border-top: 1.5px solid;
      border-left: 1.5px solid;
    }

    .corner-bracket.tr {
      top: 12px;
      right: 12px;
      border-top: 1.5px solid;
      border-right: 1.5px solid;
    }

    .corner-bracket.bl {
      bottom: 12px;
      left: 12px;
      border-bottom: 1.5px solid;
      border-left: 1.5px solid;
    }

    .corner-bracket.br {
      bottom: 12px;
      right: 12px;
      border-bottom: 1.5px solid;
      border-right: 1.5px solid;
    }

    /* ── Badge / Tag ──────────────────────────────────── */
    .telemetry-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      padding: 0.42rem 1.25rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.74rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: #f1f5f9;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.08);
      transition:
        opacity 200ms ease-out,
        filter 200ms ease-out,
        background-color 700ms cubic-bezier(0.4, 0, 0.2, 1),
        border-color 700ms cubic-bezier(0.4, 0, 0.2, 1),
        color 700ms cubic-bezier(0.4, 0, 0.2, 1),
        box-shadow 700ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    body.is-prismatic .telemetry-badge {
      background: rgba(0, 245, 255, 0.06);
      border-color: rgba(0, 245, 255, 0.28);
      color: var(--neon);
      box-shadow: 0 0 20px rgba(0, 245, 255, 0.12);
    }

    .stage-wrapper.is-blurring .telemetry-badge {
      opacity: 0.55;
      filter: blur(2px);
    }

    .badge-signal {
      position: relative;
      width: 8px;
      height: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .badge-signal::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.85);
      animation: pingGlow 2s infinite cubic-bezier(0, 0, 0.2, 1);
      transition: background-color 700ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    body.is-prismatic .badge-signal::before {
      background: var(--neon);
    }

    .badge-signal::after {
      content: '';
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffffff;
    }

    @keyframes pingGlow {

      75%,
      100% {
        transform: scale(2.4);
        opacity: 0;
      }
    }

    /* ── Master Hero Typography: COMING SOON ──────────── */
    .title-wrapper {
      position: relative;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
    }

    .main-title {
      font-size: clamp(3.2rem, 8.5vw, 5.6rem);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 15%, #cbd5e1 45%, #d4d8df 80%, #7e8794 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      position: relative;
      white-space: nowrap;
      transition: opacity 200ms ease-out;
    }

    .main-title::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #ffffff 15%, #cbd5e1 45%, #00f5ff 80%, #3b82f6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0;
      transition: opacity 700ms cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }

    body.is-prismatic .main-title::after {
      opacity: 1;
    }

    .stage-wrapper.is-blurring .main-title {
      opacity: 0.65;
    }

    /* Subtle ambient reflection behind text (Pure Radial Gradient, Zero CSS Blur) */
    .title-glow-aura {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 122%;
      height: 150%;
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.11) 0%, rgba(255, 255, 255, 0.03) 42%, transparent 72%);
      pointer-events: none;
      z-index: -1;
    }

    .title-glow-aura::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(0, 245, 255, 0.16) 0%, rgba(59, 130, 246, 0.045) 44%, transparent 72%);
      opacity: 0;
      transition: opacity 700ms cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }

    body.is-prismatic .title-glow-aura::after {
      opacity: 1;
    }

    /* ── Cyber HUD Scanner Module (Text-Free Segmented Matrix) ── */
    .cyber-scanner-module {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      width: 100%;
      max-width: 320px;
      user-select: none;
    }

    .scanner-bracket {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.48);
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.32);
      transition: color 700ms cubic-bezier(0.4, 0, 0.2, 1), text-shadow 700ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    body.is-prismatic .scanner-bracket {
      color: rgba(0, 245, 255, 0.45);
      text-shadow: 0 0 8px rgba(0, 245, 255, 0.4);
    }

    .scanner-track {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 3.5px;
      flex: 1;
      height: 20px;
      padding: 3px 6px;
      background: rgba(8, 9, 12, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 6px;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.75), 0 0 16px rgba(255, 255, 255, 0.06);
      overflow: hidden;
      transition:
        background-color 700ms cubic-bezier(0.4, 0, 0.2, 1),
        border-color 700ms cubic-bezier(0.4, 0, 0.2, 1),
        box-shadow 700ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    body.is-prismatic .scanner-track {
      background: rgba(7, 11, 20, 0.75);
      border-color: rgba(56, 189, 248, 0.2);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.7), 0 0 16px rgba(0, 245, 255, 0.08);
    }

    /* Ambient cyber laser sweep across the track (Compositor Opacity Crossfade) */
    .scanner-track::before,
    .scanner-track::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50px;
      animation: laserSweep 2.2s ease-in-out infinite alternate;
      pointer-events: none;
      transition: opacity 700ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    .scanner-track::before {
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.34), transparent);
      opacity: 1;
    }

    .scanner-track::after {
      background: linear-gradient(90deg, transparent, rgba(0, 245, 255, 0.45), transparent);
      opacity: 0;
    }

    body.is-prismatic .scanner-track::before {
      opacity: 0;
    }

    body.is-prismatic .scanner-track::after {
      opacity: 1;
    }

    @keyframes laserSweep {
      0% {
        transform: translateX(-40px);
      }

      100% {
        transform: translateX(290px);
      }
    }

    .scanner-seg {
      flex: 1;
      height: 10px;
      background: #e5e7eb;
      border-radius: 1.5px;
      opacity: 0.12;
      animation: segPulse 2.4s ease-in-out infinite;
      transition: background-color 700ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    body.is-prismatic .scanner-seg {
      background: #00f5ff;
    }

    .scanner-seg:nth-child(1) {
      animation-delay: 0.06s;
    }

    .scanner-seg:nth-child(2) {
      animation-delay: 0.12s;
    }

    .scanner-seg:nth-child(3) {
      animation-delay: 0.18s;
    }

    .scanner-seg:nth-child(4) {
      animation-delay: 0.24s;
    }

    .scanner-seg:nth-child(5) {
      animation-delay: 0.30s;
    }

    .scanner-seg:nth-child(6) {
      animation-delay: 0.36s;
    }

    .scanner-seg:nth-child(7) {
      animation-delay: 0.42s;
    }

    .scanner-seg:nth-child(8) {
      animation-delay: 0.48s;
    }

    .scanner-seg:nth-child(9) {
      animation-delay: 0.54s;
    }

    .scanner-seg:nth-child(10) {
      animation-delay: 0.60s;
    }

    .scanner-seg:nth-child(11) {
      animation-delay: 0.66s;
    }

    .scanner-seg:nth-child(12) {
      animation-delay: 0.72s;
    }

    .scanner-seg:nth-child(13) {
      animation-delay: 0.78s;
    }

    .scanner-seg:nth-child(14) {
      animation-delay: 0.84s;
    }

    .scanner-seg:nth-child(15) {
      animation-delay: 0.90s;
    }

    .scanner-seg:nth-child(16) {
      animation-delay: 0.96s;
    }

    .scanner-seg:nth-child(17) {
      animation-delay: 1.02s;
    }

    .scanner-seg:nth-child(18) {
      animation-delay: 1.08s;
    }

    .scanner-seg:nth-child(19) {
      animation-delay: 1.14s;
    }

    .scanner-seg:nth-child(20) {
      animation-delay: 1.20s;
    }

    @keyframes segPulse {

      0%,
      100% {
        opacity: 0.11;
      }

      30%,
      65% {
        opacity: 0.96;
      }
    }

    /* ── High-Tech Return Button ──────────────────────── */
    .btn-back {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      background: rgba(14, 16, 20, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: var(--text);
      text-decoration: none;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 0.95rem 2.4rem;
      border-radius: 999px;
      overflow: hidden;
      transition:
        transform 0.3s cubic-bezier(0.16, 1, 0.3, 1),
        background-color 0.55s cubic-bezier(0.4, 0, 0.2, 1),
        border-color 0.55s cubic-bezier(0.4, 0, 0.2, 1),
        box-shadow 0.55s cubic-bezier(0.4, 0, 0.2, 1),
        color 0.55s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      margin-top: 0.5rem;
    }

    body.is-prismatic .btn-back {
      background: rgba(12, 19, 34, 0.85);

  <script>
    /* ── Live HUD Clock ───────────────────────────────── */
    function updateClock() {
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      const timeStr = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      const clockEl = document.getElementById('hud-clock');
      if (clockEl) {
        clockEl.textContent = `${timeStr} UTC+7 // LIVE`;
      }
    }
    setInterval(updateClock, 1000);
    updateClock();

    /* ── Unified Stage Engine (Legacy Particle Mesh + WebGL Optical Card Backlight) ── */
    (function () {
      const canvas = document.getElementById('ambient-canvas');
      const particleCanvas = document.getElementById('particle-canvas');
      const stage = document.getElementById('stage');
      const cardRig = document.getElementById('cardRig');
      const card = document.getElementById('card');
      const spotlight = document.getElementById('spotlight');
      const cur = document.getElementById('cursor');
      const ring = document.getElementById('cursor-ring');
      if (!canvas || !card || !cardRig) return;

      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const coarsePointer = window.matchMedia('(pointer: coarse), (hover: none)').matches;
      const canHover = window.matchMedia('(hover: hover)').matches && !coarsePointer;
      const PERSPECTIVE = 1200;
      const DEG2RAD = Math.PI / 180;
      const TWO_PI = Math.PI * 2;

      // Bake tiny static 128x128 matte film grain texture once for opaque card surface
      (function bakeCardGrain() {
        try {
          const tile = document.createElement('canvas');
          tile.width = 128;
          tile.height = 128;
          const tctx = tile.getContext('2d');
          if (!tctx || typeof tctx.createImageData !== 'function') return;
          const img = tctx.createImageData(128, 128);
          const data = img.data;
          let seed = 1337;
          for (let i = 0; i < data.length; i += 4) {
            seed = (seed * 1664525 + 1013904223) >>> 0;
            const v = (seed >>> 24) & 255;
            data[i] = v;
            data[i + 1] = v;
            data[i + 2] = v;
            data[i + 3] = 255;
          }
          tctx.putImageData(img, 0, 0);
          if (typeof tile.toDataURL === 'function') {
            card.style.setProperty('--card-grain-url', `url(${tile.toDataURL('image/png')})`);
          }
        } catch (e) { }
      })();

      // Viewport & cached untransformed card geometry (zero getBoundingClientRect in pointermove)
      let vw = window.innerWidth || 1280;
      let vh = window.innerHeight || 720;
      let scaleCap = 1.0;
      let scale = 1.0;
      /* === ARCHIVED BACKGROUND (Micro-LED Light Field): grid state ===
      let spacing = 24;
      let gridOffsetX = 0;
      let gridOffsetY = 0;
      === END ARCHIVED === */

      let cardW = 680, cardH = 420, cardCX = vw * 0.5, cardCY = vh * 0.5;
      let cardRadius = 32, bleed = 240;

      // Pointer, cursor, tilt, entrance & theme state
      let mx = vw * 0.5, my = vh * 0.5;
      let rx = mx, ry = my;
      let pointerActive = false, hasPointer = false;
      /* === ARCHIVED BACKGROUND (Micro-LED Light Field): pointer halo state ===
      let pointerStrength = 0;
      let smoothPtrX = mx, smoothPtrY = my;
      === END ARCHIVED === */

      let targetMX = -220, targetMY = 240;
      let smoothMX = targetMX, smoothMY = targetMY;

      let targetTiltX = 0, targetTiltY = 0;
      let curTiltX = 0, curTiltY = 0;
      let entranceElapsed = reducedMotion ? 1.0 : 0.0;
      const ENTRANCE_DUR = 0.9;
      let lastTransformKey = '';
      let lastSpotKey = '';
      let lastCursorKey = '';

      let prismaticMode = false;
      let themeMix = 0;
      let burstTimer = 0;
      let burstPeak = 1.0;

      // Loop, idle throttle & one-way adaptive scale governor
      let rafId = null;
      let lastTime = 0;
      let lastDrawNow = 0;
      let elapsed = 1.6;
      let lastInputNow = 0;
      let revealed = false;

      let slowFrameCount = 0;
      let downgradedScale = false;
      const START_NOW = performance.now();
      const invH = new Float32Array([1, 0, 0, 0, 1, 0, 0, 0, 1]);

      // Legacy Cyber Particle Mesh (45 interactive nodes, mouse repulsion, zero shadowBlur)
      const pCtx = particleCanvas ? particleCanvas.getContext('2d') : null;
      const PARTICLE_COUNT = 45;
      const CONNECT_DIST = 120;
      const CONNECT_DIST_SQ = CONNECT_DIST * CONNECT_DIST;
      const REPEL_DIST = 130;
      const particles = [];

      function initParticles() {
        particles.length = 0;
        let seed = 4207;
        const rand = () => {
          seed = (seed * 1664525 + 1013904223) >>> 0;
          return seed / 4294967296;
        };
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          const baseAlpha = rand() * 0.45 + 0.25;
          particles.push({
            x: rand() * vw,
            y: rand() * vh,
            vx: (rand() - 0.5) * 0.55,
            vy: (rand() - 0.5) * 0.55,
            radius: rand() * 1.6 + 0.8,
            baseAlpha,
            alpha: baseAlpha
          });
        }
      }

      function drawParticles(dt) {
        if (!pCtx) return;
        pCtx.clearRect(0, 0, vw, vh);

        const stepScale = reducedMotion ? 0 : dt * 60;
        const reactMouse = !reducedMotion && canHover && pointerActive;

        // Update particles (time-scaled so 30fps / 60fps / 120fps drift at identical speed)
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          if (stepScale > 0) {
            p.x += p.vx * stepScale;
            p.y += p.vy * stepScale;
            if (p.x < 0) { p.x = 0; p.vx = Math.abs(p.vx); }
            else if (p.x > vw) { p.x = vw; p.vx = -Math.abs(p.vx); }
            if (p.y < 0) { p.y = 0; p.vy = Math.abs(p.vy); }
            else if (p.y > vh) { p.y = vh; p.vy = -Math.abs(p.vy); }
          }

          if (reactMouse) {
            const dx = mx - p.x;
            const dy = my - p.y;
            const distSq = dx * dx + dy * dy;
            if (distSq < REPEL_DIST * REPEL_DIST && distSq > 0.0001) {
              const dist = Math.sqrt(distSq);
              const force = (REPEL_DIST - dist) / REPEL_DIST;
              p.x -= (dx / dist) * force * 1.5 * stepScale;
              p.y -= (dy / dist) * force * 1.5 * stepScale;
              p.alpha = Math.min(0.9, p.baseAlpha + 0.35);
            } else {
              p.alpha = p.baseAlpha;
            }
          } else {
            p.alpha = p.baseAlpha;
          }
        }

        // Sync palette smoothly: Monochrome Silver <-> Prismatic Cyber Cyan/Blue
        const lr = (214 + (56 - 214) * themeMix) | 0;
        const lg = (222 + (189 - 222) * themeMix) | 0;
        const lb = (234 + (248 - 234) * themeMix) | 0;
        const pr = (238 + (0 - 238) * themeMix) | 0;
        const pg = (242 + (245 - 242) * themeMix) | 0;
        const pb = (248 + (255 - 248) * themeMix) | 0;

        // Draw mesh connections
        pCtx.lineWidth = 0.8;
        for (let i = 0; i < particles.length; i++) {
          const pi = particles[i];
          for (let j = i + 1; j < particles.length; j++) {
            const pj = particles[j];
            const dx = pi.x - pj.x;
            const dy = pi.y - pj.y;
            const distSq = dx * dx + dy * dy;
            if (distSq < CONNECT_DIST_SQ) {
              const dist = Math.sqrt(distSq);
              const lineAlpha = (1 - dist / CONNECT_DIST) * (0.14 + 0.04 * themeMix);
              pCtx.beginPath();
              pCtx.moveTo(pi.x, pi.y);
              pCtx.lineTo(pj.x, pj.y);
              pCtx.strokeStyle = `rgba(${lr}, ${lg}, ${lb}, ${lineAlpha.toFixed(3)})`;
              pCtx.stroke();
            }
          }
        }

        // Draw particle halos + cores (replaces expensive shadowBlur = 8)
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          pCtx.beginPath();
          pCtx.arc(p.x, p.y, p.radius * 2.4, 0, TWO_PI);
          pCtx.fillStyle = `rgba(${pr}, ${pg}, ${pb}, ${(p.alpha * 0.22).toFixed(3)})`;
          pCtx.fill();

          pCtx.beginPath();
          pCtx.arc(p.x, p.y, p.radius, 0, TWO_PI);
          pCtx.fillStyle = `rgba(${pr}, ${pg}, ${pb}, ${p.alpha.toFixed(3)})`;
          pCtx.fill();
        }
      }

      // Exact analytic inverse homography matching CSS:
      // perspective(1200px) on .stage-wrapper + translate3d(0, ty, 0) scale(sc) rotateX(ax) rotateY(ay)
      function updateInvHomography(axDeg, ayDeg, ty, sc) {
        const ax = axDeg * DEG2RAD;
        const ay = ayDeg * DEG2RAD;
        const cx = Math.cos(ax), sx = Math.sin(ax);
        const cy = Math.cos(ay), sy = Math.sin(ay);
        const invP = 1 / PERSPECTIVE;

        const a = sc * cy;
        const d = sc * sx * sy;
        const e = sc * cx;
        const f = ty;
        const g = cx * sy * invP;
        const h = -sx * invP;
        const det = a * (e - f * h);
        if (Math.abs(det) < 1e-8) {
          invH[0] = 1; invH[1] = 0; invH[2] = 0;
          invH[3] = 0; invH[4] = 1; invH[5] = 0;
          invH[6] = 0; invH[7] = 0; invH[8] = 1;
          return;
        }
        const invDet = 1 / det;
        // Column-major layout for WebGL uniformMatrix3fv(..., false, invH)
        invH[0] = (e - f * h) * invDet;
        invH[1] = -(d - f * g) * invDet;
        invH[2] = (d * h - e * g) * invDet;
        invH[3] = 0;
        invH[4] = a * invDet;
        invH[5] = -(a * h) * invDet;
        invH[6] = 0;
        invH[7] = -(a * f) * invDet;
        invH[8] = (a * e) * invDet;
      }

      // WebGL 1.0 Optical Card Backlight (Transparent premultiplied overlay over Legacy Background)
      // ARCHIVED NOTE: Set alpha: false to re-enable opaque unified Micro-LED shader
      const glOpts = {
        alpha: true,
        premultipliedAlpha: true,
        antialias: false,
        depth: false,
        stencil: false,
        powerPreference: 'high-performance'
      };
      let gl = null;
      let glProg = null;
      let glBuf = null;
      let locs = null;

      const vsSrc = `
        attribute vec2 a_pos;
        void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }
      `;

      const fsSrc = `
        #ifdef GL_FRAGMENT_PRECISION_HIGH
        precision highp float;
        #else
        precision mediump float;
        #endif

        uniform vec2 u_pixelRes;
        uniform float u_scale;
        uniform float u_themeMix;

        /* === ARCHIVED BACKGROUND (Micro-LED Light Field): shader uniforms ===
        uniform vec2 u_viewport;
        uniform float u_time;
        uniform float u_spacing;
        uniform vec2 u_gridOffset;
        uniform vec2 u_pointerPos;
        uniform float u_pointerStrength;
        uniform float u_influenceRadius;
        === END ARCHIVED === */

        uniform vec2 u_cardCenter;
        uniform vec2 u_half;
        uniform float u_radius;
        uniform float u_bleed;
        uniform vec2 u_cardMouse;
        uniform float u_burst;
        uniform mat3 u_invH;

        float sdRoundedBox(vec2 p, vec2 b, float r) {
          vec2 q = abs(p) - b + vec2(r);
          return min(max(q.x, q.y), 0.0) + length(max(q, 0.0)) - r;
        }

        float hash12(vec2 p) {
          vec3 p3 = fract(vec3(p.xyx) * 0.1031);
          p3 += dot(p3, p3.yzx + vec3(33.33));
          return fract((p3.x + p3.y) * p3.z);
        }

        vec3 prismaticColor(float ang) {
          float t = fract((ang + 3.14159265) / 6.2831853);
          vec3 cLeft  = vec3(0.96, 0.24, 0.56);
          vec3 cTop   = vec3(0.68, 0.36, 1.00);
          vec3 cRight = vec3(0.22, 0.50, 1.00);
          vec3 cBR    = vec3(0.32, 0.90, 1.00);
          vec3 cBot   = vec3(0.36, 0.86, 0.62);
          vec3 cBL    = vec3(1.00, 0.78, 0.82);

          if (t < 0.22) return mix(cLeft, cTop, smoothstep(0.0, 0.22, t));
          if (t < 0.48) return mix(cTop, cRight, smoothstep(0.22, 0.48, t));
          if (t < 0.62) return mix(cRight, cBR, smoothstep(0.48, 0.62, t));
          if (t < 0.76) return mix(cBR, cBot, smoothstep(0.62, 0.76, t));
          if (t < 0.89) return mix(cBot, cBL, smoothstep(0.76, 0.89, t));
          return mix(cBL, cLeft, smoothstep(0.89, 1.0, t));
        }

        void main() {
          float invScale = 1.0 / max(u_scale, 0.25);
          vec2 cssPos = vec2(gl_FragCoord.x, u_pixelRes.y - gl_FragCoord.y) * invScale;

          // Transform screen pixel into card's tilted local plane via analytic inverse homography
          vec2 pScreen = cssPos - u_cardCenter;
          vec3 qLocal = u_invH * vec3(pScreen, 1.0);
          vec2 pLocal = qLocal.xy / max(qLocal.z, 0.0001);

          float d = sdRoundedBox(pLocal, u_half, u_radius);
          float aa = 0.75 * invScale;

          // Region Early-Out: Skip occluded opaque card interior & everything outside backlight bleed
          if (d < -1.5 - aa || d >= u_bleed) {
            gl_FragColor = vec4(0.0);
            return;
          }

          vec3 bgBase = mix(vec3(5.0, 6.0, 8.0), vec3(7.0, 11.0, 20.0), u_themeMix) / 255.0;

          /* === ARCHIVED BACKGROUND (Micro-LED Light Field): uniform uploads ===
          const influenceRadius = vw < 768 ? 150 : 230;
          gl.uniform2f(locs.viewport, vw, vh);
          gl.uniform1f(locs.time, elapsed);
          gl.uniform1f(locs.spacing, spacing);
          gl.uniform2f(locs.gridOffset, gridOffsetX, gridOffsetY);
          gl.uniform2f(locs.pointerPos, smoothPtrX, smoothPtrY);
          gl.uniform1f(locs.pointerStrength, pointerStrength);
          gl.uniform1f(locs.influenceRadius, influenceRadius);
          === END ARCHIVED === */
          gl.uniform2f(locs.cardCenter, cardCX, cardCY);
          gl.uniform2f(locs.half, cardW * 0.5, cardH * 0.5);
          gl.uniform1f(locs.radius, cardRadius);
          gl.uniform1f(locs.bleed, bleed);
          gl.uniform2f(locs.cardMouse, smoothMX, smoothMY);
          gl.uniform1f(locs.burst, smoothBurst);
          gl.uniformMatrix3fv(locs.invH, false, invH);
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        } else {
          draw2DFallback(smoothBurst);
        }

        lastDrawNow = now;
        revealLayers();
      }

      function isInteractiveActive(now) {
        if ((now - lastInputNow) < 1500) return true;
        if (entranceElapsed < ENTRANCE_DUR) return true;
        if (burstTimer > 0) return true;
        if (Math.abs((prismaticMode ? 1 : 0) - themeMix) > 0.001) return true;
        if (Math.abs(targetTiltX - curTiltX) > 0.002 || Math.abs(targetTiltY - curTiltY) > 0.002) return true;
        if (Math.abs(mx - rx) > 0.3 || Math.abs(my - ry) > 0.3) return true;
        if (hasPointer && (Math.abs(targetMX - smoothMX) > 0.35 || Math.abs(targetMY - smoothMY) > 0.35)) return true;
        return false;
      }

      function tick(now) {
        rafId = requestAnimationFrame(tick);
        if (!lastTime) {
          lastTime = now;
          lastDrawNow = now;
        }
        const frameMs = now - lastTime;
        const active = isInteractiveActive(now);

        // Idle throttle: cap gentle particle drift & rim sweep to ~30fps when pointer & transitions are idle
        if (!active && (now - lastDrawNow) < 33.0) {
          return;
        }

        // One-way adaptive scale governor (1.0 -> 0.75) after 1.5s warm-up debounce, never bounces back
        if (active && gl && !downgradedScale && (now - START_NOW) > 1500 && frameMs < 120) {
          if (frameMs > 20.5) {
            slowFrameCount++;
            if (slowFrameCount >= 24) {
              downgradedScale = true;
              scaleCap = 0.75;
              syncMetrics();
            }
          } else if (slowFrameCount > 0) {
            slowFrameCount--;
          }
        }

        const dt = Math.min(0.05, Math.max(0.001, (now - lastTime) * 0.001));
        lastTime = now;
        elapsed += dt;
        renderFrame(dt, now);
      }

      function start() {
        if (reducedMotion) {
          renderFrame(0, performance.now());
          return;
        }
        if (rafId === null) {
          lastTime = 0;
          lastDrawNow = 0;
          rafId = requestAnimationFrame(tick);
        }
      }

      function stop() {
        if (rafId !== null) {
          cancelAnimationFrame(rafId);
          rafId = null;
        }
      }

      if (!reducedMotion) {
        cardRig.style.opacity = '0';
        cardRig.style.transform = 'translate3d(0px, 36.00px, 0px) scale(0.9400) rotateX(0.000deg) rotateY(0.000deg)';
        lastTransformKey = '36.00|0.9400|0.000|0.000';
        updateInvHomography(0, 0, 36, 0.94);
      }

      // Single passive pointermove listener (stores coordinates only — zero DOM reads/writes)
      if (canHover) {
        window.addEventListener('pointermove', e => {
          mx = e.clientX;
          my = e.clientY;
          hasPointer = true;
          pointerActive = true;
          lastInputNow = performance.now();
        }, { passive: true });

        document.addEventListener('mouseleave', () => {
          pointerActive = false;
          lastInputNow = performance.now();
        });
      }

      // Monochrome White (default) <-> Click 360-degree Flare + Full-Screen Prismatic Color Sync
      card.addEventListener('click', e => {
        if (e.target && e.target.closest && e.target.closest('#btnBack')) return;
        prismaticMode = !prismaticMode;
        lastInputNow = performance.now();
        card.classList.toggle('is-prismatic', prismaticMode);
        card.setAttribute('data-backlight-mode', prismaticMode ? 'prismatic' : 'monochrome');
        document.body.classList.toggle('is-prismatic', prismaticMode);
        document.body.setAttribute('data-theme-mode', prismaticMode ? 'prismatic' : 'monochrome');

        if (reducedMotion) {
          themeMix = prismaticMode ? 1 : 0;
          burstTimer = 0;
          renderFrame(0, performance.now());
        } else {
          burstPeak = prismaticMode ? 1.0 : 0.55;
          burstTimer = 1.0;
        }
      });

      canvas.addEventListener('webglcontextlost', e => {
        e.preventDefault();
        stop();
      });

      canvas.addEventListener('webglcontextrestored', () => {
        gl = null;
        initWebGL();
        syncMetrics();
        if (!document.hidden) start();
      });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) stop();
        else start();
      });

      window.addEventListener('resize', syncMetrics);
      if (typeof ResizeObserver === 'function') {
        new ResizeObserver(syncMetrics).observe(stage || card);
      }

      syncMetrics();
      start();
    })();

    /* ── Sci-Fi Micro Sound FX (Web Audio API) ────────── */
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playCyberBeep(freq = 900, duration = 0.04) {
      try {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.5, audioCtx.currentTime + duration);

        gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) { }
    }

    const btnBack = document.getElementById('btnBack');
    if (btnBack) {
      btnBack.addEventListener('mouseenter', () => playCyberBeep(850, 0.03));
      btnBack.addEventListener('click', () => playCyberBeep(1200, 0.06));
    }
  </script>
</body>

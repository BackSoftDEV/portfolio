<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Coming Soon · BackDEV</title>
  <meta name="description" content="Coming Soon · BackDEV" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    :root {
      --bg: #070b14;
      --card: rgba(12, 19, 34, 0.78);
      --border: rgba(56, 189, 248, 0.2);
      --neon: #00f5ff;
      --neon2: #3b82f6;
      --amber: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', -apple-system, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      overflow: hidden;
      position: relative;
      background-image: 
        radial-gradient(circle at 50% 35%, rgba(0, 245, 255, 0.08) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(37, 99, 235, 0.06) 0%, transparent 50%),
        radial-gradient(circle at 20% 80%, rgba(245, 158, 11, 0.04) 0%, transparent 50%);
    }

    /* Ambient Canvas */
    #ambient-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* Minimal Card Container */
    .coming-card {
      position: relative;
      z-index: 1;
      max-width: 580px;
      width: 100%;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 4rem 2.5rem;
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.8rem;
      animation: floatUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes floatUp {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(0, 245, 255, 0.08);
      border: 1px solid rgba(0, 245, 255, 0.28);
      border-radius: 99px;
      padding: 0.45rem 1.2rem;
      color: var(--neon);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      background: var(--neon);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--neon);
      animation: pulseGlow 1.8s infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(0, 245, 255, 0.6); }
      50% { box-shadow: 0 0 0 7px rgba(0, 245, 255, 0); }
    }

    /* Main Big Title */
    .title {
      font-size: clamp(3rem, 8vw, 4.5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 30%, var(--neon) 80%, var(--neon2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 25px rgba(0, 245, 255, 0.25));
    }

    /* Cyber Segmented Line (Thay cho thanh loading cu, khong text, khong %) */
    .cyber-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      width: 220px;
      height: 6px;
      margin: 0.2rem 0;
    }

    .cyber-bar span {
      flex: 1;
      height: 100%;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      animation: barGlow 2.4s ease-in-out infinite;
    }

    .cyber-bar span:nth-child(1) { animation-delay: 0.1s; }
    .cyber-bar span:nth-child(2) { animation-delay: 0.2s; }
    .cyber-bar span:nth-child(3) { animation-delay: 0.3s; }
    .cyber-bar span:nth-child(4) { animation-delay: 0.4s; }
    .cyber-bar span:nth-child(5) { animation-delay: 0.5s; }
    .cyber-bar span:nth-child(6) { animation-delay: 0.6s; }
    .cyber-bar span:nth-child(7) { animation-delay: 0.7s; }
    .cyber-bar span:nth-child(8) { animation-delay: 0.8s; }
    .cyber-bar span:nth-child(9) { animation-delay: 0.9s; }
    .cyber-bar span:nth-child(10) { animation-delay: 1.0s; }
    .cyber-bar span:nth-child(11) { animation-delay: 1.1s; }
    .cyber-bar span:nth-child(12) { animation-delay: 1.2s; }

    @keyframes barGlow {
      0%, 100% {
        background: rgba(255, 255, 255, 0.1);
        box-shadow: none;
      }
      50% {
        background: var(--neon);
        box-shadow: 0 0 8px var(--neon);
      }
    }

    /* Back Button */
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.85rem 2rem;
      border-radius: 99px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      margin-top: 0.4rem;
    }

    .btn-back:hover {
      background: rgba(0, 245, 255, 0.12);
      border-color: var(--neon);
      color: var(--neon);
      transform: translateY(-2px);
      box-shadow: 0 0 24px rgba(0, 245, 255, 0.25);
    }

    .btn-back span {
      transition: transform 0.25s ease;
    }

    .btn-back:hover span:first-child {
      transform: translateX(-3px);
    }

    /* Footer Note */
    .footer-note {
      position: absolute;
      bottom: 1.5rem;
      font-size: 0.78rem;
      color: rgba(148, 163, 184, 0.5);
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.06em;
    }

    @media (max-width: 640px) {
      .coming-card {
        padding: 3rem 1.5rem;
        border-radius: 22px;
        gap: 1.5rem;
      }

      .title {
        font-size: clamp(2.4rem, 10vw, 3.2rem);
      }

      .btn-back {
        width: 100%;
        justify-content: center;
      }

      .footer-note {
        position: static;
        margin-top: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <!-- Minimal Ambient Star Canvas -->
  <canvas id="ambient-canvas"></canvas>

  <div class="coming-card">
    <div class="badge">
      <span class="pulse-dot"></span>
      <span>COMING SOON</span>
    </div>

    <h1 class="title">Coming Soon</h1>

    <!-- Thanh cyber phan doan tinh te (Khong text, khong %) -->
    <div class="cyber-bar" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>

    <a href="index.html" class="btn-back">
      <span>←</span>
      <span>Quay lại Portfolio</span>
    </a>
  </div>

  <div class="footer-note">
    BackDEV · Personal Project
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('ambient-canvas');
      const ctx = canvas.getContext('2d');
      let w, h;
      let stars = [];

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      for (let i = 0; i < 40; i++) {
        stars.push({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 1.5 + 0.5,
          alpha: Math.random() * 0.6 + 0.2,
          speed: Math.random() * 0.008 + 0.003
        });
      }

      function draw() {
        ctx.clearRect(0, 0, w, h);
        stars.forEach(s => {
          s.alpha += s.speed;
          if (s.alpha > 0.8 || s.alpha < 0.2) s.speed = -s.speed;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(0, 245, 255, ${Math.max(0, s.alpha)})`;
          ctx.fill();
        });
        requestAnimationFrame(draw);
      }
      draw();
    })();
  </script>
</body>
</html>

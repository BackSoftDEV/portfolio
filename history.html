<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Coming Soon · BackDEV</title>
  <meta name="description" content="Coming Soon · BackDEV Industrial Mission Control" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    :root {
      --bg: #070b14;
      --bg2: #0c1322;
      --card: rgba(12, 19, 34, 0.75);
      --border: rgba(56, 189, 248, 0.2);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --neon: #00f5ff;
      --neon2: #3b82f6;
      --amber: #f59e0b;
      --emerald: #10b981;
      --text: #f8fafc;
      --text2: #cbd5e1;
      --text-muted: #94a3b8;
      --glow: 0 0 35px rgba(0, 245, 255, 0.22);
      --glow-amber: 0 0 30px rgba(245, 158, 11, 0.25);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      cursor: none !important;
    }

    @media (pointer: coarse),
    (hover: none) {

      *,
      *::before,
      *::after {
        cursor: auto !important;
      }

      #cursor,
      #cursor-ring {
        display: none !important;
      }
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Cyber Background & Ambient Bloom */
    .viewport-container {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background-image:
        radial-gradient(circle at 50% 45%, rgba(0, 245, 255, 0.09) 0%, transparent 60%),
        radial-gradient(circle at 15% 15%, rgba(59, 130, 246, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(245, 158, 11, 0.05) 0%, transparent 40%);
    }

    /* Interactive Particle Grid Canvas */
    #ambient-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Subtle Scanline Overlay */
    .scanline-overlay {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg,
          transparent,
          transparent 2px,
          rgba(0, 245, 255, 0.018) 2px,
          rgba(0, 245, 255, 0.018) 4px);
      pointer-events: none;
      z-index: 2;
    }

    /* Subtle Cyber Tech Grid */
    .grid-backdrop {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(56, 189, 248, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.035) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 1;
      mask-image: radial-gradient(circle at 50% 50%, black 40%, transparent 85%);
      -webkit-mask-image: radial-gradient(circle at 50% 50%, black 40%, transparent 85%);
    }

    /* ── HUD Telemetry Frames (Corners & Edges) ────────── */
    .hud-edge {
      position: absolute;
      z-index: 5;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      color: rgba(148, 163, 184, 0.65);
      user-select: none;
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .hud-tl {
      top: 1.5rem;
      left: 1.75rem;
    }

    .hud-tr {
      top: 1.5rem;
      right: 1.75rem;
    }

    .hud-bl {
      bottom: 1.5rem;
      left: 1.75rem;
    }

    .hud-br {
      bottom: 1.5rem;
      right: 1.75rem;
    }

    .hud-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--neon);
      box-shadow: 0 0 10px var(--neon);
      animation: pulseNeon 2s infinite ease-in-out;
    }

    @keyframes pulseNeon {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.35;
        transform: scale(0.85);
      }
    }

    .hud-live-tag {
      color: var(--neon);
      font-weight: 600;
    }

    /* ── Center Stage & Perspective Wrapper ───────────── */
    .stage-wrapper {
      position: relative;
      z-index: 10;
      perspective: 1200px;
      max-width: 680px;
      width: 100%;
    }

    /* ── Main Bento Glass Card ────────────────────────── */
    .coming-card {
      position: relative;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 32px;
      padding: 4.5rem 3rem 4rem;
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      box-shadow:
        0 30px 80px -20px rgba(0, 0, 0, 0.8),
        0 0 0 1px rgba(255, 255, 255, 0.05),
        inset 0 1px 0 rgba(255, 255, 255, 0.14);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 2.2rem;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease;
      transform-style: preserve-3d;
      animation: entranceCard 1s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes entranceCard {
      from {
        opacity: 0;
        transform: translateY(40px) scale(0.94);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Interactive Spotlight Layer */
    .card-spotlight {
      position: absolute;
      inset: 0;
      border-radius: 32px;
      pointer-events: none;
      background: radial-gradient(500px circle at var(--spot-x, 50%) var(--spot-y, 50%),
          rgba(0, 245, 255, 0.08),
          transparent 60%);
      transition: opacity 0.3s;
    }

    /* Sci-Fi HUD Corner Brackets */
    .corner-bracket {
      position: absolute;
      width: 14px;
      height: 14px;
      pointer-events: none;
      border-color: rgba(0, 245, 255, 0.45);
    }

    .corner-bracket.tl {
      top: 12px;
      left: 12px;
      border-top: 1.5px solid;
      border-left: 1.5px solid;
    }

    .corner-bracket.tr {
      top: 12px;
      right: 12px;
      border-top: 1.5px solid;
      border-right: 1.5px solid;
    }

    .corner-bracket.bl {
      bottom: 12px;
      left: 12px;
      border-bottom: 1.5px solid;
      border-left: 1.5px solid;
    }

    .corner-bracket.br {
      bottom: 12px;
      right: 12px;
      border-bottom: 1.5px solid;
      border-right: 1.5px solid;
    }

    /* ── Badge / Tag ──────────────────────────────────── */
    .telemetry-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      background: rgba(0, 245, 255, 0.06);
      border: 1px solid rgba(0, 245, 255, 0.28);
      border-radius: 999px;
      padding: 0.42rem 1.25rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.74rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--neon);
      box-shadow: 0 0 20px rgba(0, 245, 255, 0.12);
      transition: all 0.3s ease;
    }

    .badge-signal {
      position: relative;
      width: 8px;
      height: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .badge-signal::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--neon);
      animation: pingGlow 2s infinite cubic-bezier(0, 0, 0.2, 1);
    }

    .badge-signal::after {
      content: '';
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffffff;
    }

    @keyframes pingGlow {

      75%,
      100% {
        transform: scale(2.4);
        opacity: 0;
      }
    }

    /* ── Master Hero Typography: COMING SOON ──────────── */
    .title-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
    }

    .main-title {
      font-size: clamp(3.2rem, 8.5vw, 5.6rem);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 15%, #cbd5e1 45%, var(--neon) 80%, var(--neon2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 32px rgba(0, 245, 255, 0.3));
      position: relative;
      white-space: nowrap;
    }

    /* Subtle ambient reflection behind text */
    .title-glow-aura {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 85%;
      height: 60%;
      background: radial-gradient(ellipse at center, rgba(0, 245, 255, 0.18) 0%, transparent 70%);
      filter: blur(25px);
      pointer-events: none;
      z-index: -1;
    }

    /* ── Cyber HUD Scanner Module (Text-Free Segmented Matrix) ── */
    .cyber-scanner-module {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      width: 100%;
      max-width: 320px;
      user-select: none;
    }

    .scanner-bracket {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      font-weight: 700;
      color: rgba(0, 245, 255, 0.45);
      text-shadow: 0 0 8px rgba(0, 245, 255, 0.4);
    }

    .scanner-track {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 3.5px;
      flex: 1;
      height: 20px;
      padding: 3px 6px;
      background: rgba(7, 11, 20, 0.75);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 6px;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.7), 0 0 16px rgba(0, 245, 255, 0.08);
      overflow: hidden;
    }

    /* Ambient cyber laser sweep across the track */
    .scanner-track::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50px;
      background: linear-gradient(90deg, transparent, rgba(0, 245, 255, 0.45), transparent);
      animation: laserSweep 2.2s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes laserSweep {
      0% {
        transform: translateX(-40px);
      }
      100% {
        transform: translateX(290px);
      }
    }

    .scanner-seg {
      flex: 1;
      height: 10px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 1.5px;
      animation: segPulse 2.4s ease-in-out infinite;
    }

    .scanner-seg:nth-child(1)  { animation-delay: 0.06s; }
    .scanner-seg:nth-child(2)  { animation-delay: 0.12s; }
    .scanner-seg:nth-child(3)  { animation-delay: 0.18s; }
    .scanner-seg:nth-child(4)  { animation-delay: 0.24s; }
    .scanner-seg:nth-child(5)  { animation-delay: 0.30s; }
    .scanner-seg:nth-child(6)  { animation-delay: 0.36s; }
    .scanner-seg:nth-child(7)  { animation-delay: 0.42s; }
    .scanner-seg:nth-child(8)  { animation-delay: 0.48s; }
    .scanner-seg:nth-child(9)  { animation-delay: 0.54s; }
    .scanner-seg:nth-child(10) { animation-delay: 0.60s; }
    .scanner-seg:nth-child(11) { animation-delay: 0.66s; }
    .scanner-seg:nth-child(12) { animation-delay: 0.72s; }
    .scanner-seg:nth-child(13) { animation-delay: 0.78s; }
    .scanner-seg:nth-child(14) { animation-delay: 0.84s; }
    .scanner-seg:nth-child(15) { animation-delay: 0.90s; }
    .scanner-seg:nth-child(16) { animation-delay: 0.96s; }
    .scanner-seg:nth-child(17) { animation-delay: 1.02s; }
    .scanner-seg:nth-child(18) { animation-delay: 1.08s; }
    .scanner-seg:nth-child(19) { animation-delay: 1.14s; }
    .scanner-seg:nth-child(20) { animation-delay: 1.20s; }

    @keyframes segPulse {
      0%, 100% {
        background: rgba(255, 255, 255, 0.08);
        box-shadow: none;
      }
      30%, 65% {
        background: var(--neon);
        box-shadow: 0 0 8px var(--neon);
      }
    }

    /* ── High-Tech Return Button ──────────────────────── */
    .btn-back {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      background: rgba(12, 19, 34, 0.85);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 0.95rem 2.4rem;
      border-radius: 999px;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      margin-top: 0.5rem;
    }

    .btn-back::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(0, 245, 255, 0.15), transparent);
      transform: translateX(-100%);
      transition: transform 0.6s ease;
    }

    .btn-back:hover::before {
      transform: translateX(100%);
    }

    .btn-back:hover {
      background: rgba(0, 245, 255, 0.1);
      border-color: var(--neon);
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 0 28px rgba(0, 245, 255, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }

    .btn-arrow {
      font-size: 1.1rem;
      transition: transform 0.25s ease;
    }

    .btn-back:hover .btn-arrow {
      transform: translateX(-4px);
      color: var(--neon);
    }

    /* ── Custom Cursor Matching Index ─────────────────── */
    #cursor {
      position: fixed;
      width: 8px;
      height: 8px;
      background: var(--neon);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: width 0.2s, height 0.2s, opacity 0.2s;
      box-shadow: 0 0 14px var(--neon);
    }

    #cursor-ring {
      position: fixed;
      width: 32px;
      height: 32px;
      border: 1.5px solid var(--neon);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      transition: all 0.12s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 0.45;
    }

    body:has(a:hover, button:hover, .btn-back:hover) #cursor {
      width: 14px;
      height: 14px;
      opacity: 0.9;
    }

    body:has(a:hover, button:hover, .btn-back:hover) #cursor-ring {
      width: 48px;
      height: 48px;
      opacity: 0.25;
      border-color: var(--neon);
    }

    /* ── Responsive Mobile Optimizations ──────────────── */
    @media (max-width: 768px) {
      .viewport-container {
        padding: 1.25rem;
      }

      .coming-card {
        padding: 3.5rem 1.6rem 2.8rem;
        border-radius: 24px;
        gap: 1.8rem;
      }

      .main-title {
        font-size: clamp(2.4rem, 11vw, 3.4rem);
        letter-spacing: -0.02em;
      }

      .hud-tl,
      .hud-tr,
      .hud-bl,
      .hud-br {
        font-size: 0.65rem;
      }

      .hud-tl {
        top: 1rem;
        left: 1.2rem;
      }

      .hud-tr {
        top: 1rem;
        right: 1.2rem;
      }

      .hud-bl {
        bottom: 1rem;
        left: 1.2rem;
      }

      .hud-br {
        bottom: 1rem;
        right: 1.2rem;
      }

      .btn-back {
        width: 100%;
        max-width: 300px;
        padding: 0.85rem 1.8rem;
      }
    }

    @media (max-width: 480px) {

      .hud-bl,
      .hud-br {
        display: none;
      }
    }
  </style>
</head>

<body>

  <!-- Custom Cyber Cursor -->
  <div id="cursor"></div>
  <div id="cursor-ring"></div>

  <!-- Ambient Interactive Canvas & Scanlines -->
  <div class="viewport-container" id="container">
    <canvas id="ambient-canvas"></canvas>
    <div class="grid-backdrop"></div>
    <div class="scanline-overlay"></div>

    <!-- HUD Telemetry Corners -->
    <div class="hud-edge hud-tl">
      <span class="hud-dot"></span>
      <span class="hud-live-tag">SYS_STATUS</span>
      <span>// INITIALIZING</span>
    </div>

    <div class="hud-edge hud-tr" id="hud-clock">
      <span>00:00:00 UTC</span>
    </div>

    <div class="hud-edge hud-bl">
      <span>BACKDEV // INDUSTRIAL ARCHITECT</span>
    </div>

    <div class="hud-edge hud-br">
      <span>LATENCY: 14MS // READY</span>
    </div>

    <!-- Main Stage Bento Card -->
    <div class="stage-wrapper" id="stage">
      <div class="coming-card" id="card">
        <div class="card-spotlight" id="spotlight"></div>

        <!-- Corner Sci-Fi Tech Brackets -->
        <span class="corner-bracket tl"></span>
        <span class="corner-bracket tr"></span>
        <span class="corner-bracket bl"></span>
        <span class="corner-bracket br"></span>

        <!-- Badge -->
        <div class="telemetry-badge">
          <span class="badge-signal"></span>
          <span>COMING SOON</span>
        </div>

        <!-- Centerpiece Typography -->
        <div class="title-wrapper">
          <div class="title-glow-aura"></div>
          <h1 class="main-title">Coming Soon</h1>
        </div>

        <!-- Cyber HUD Scanner Bar (Pure High-Tech Segmented Matrix, No Text) -->
        <div class="cyber-scanner-module" aria-hidden="true">
          <span class="scanner-bracket">[</span>
          <div class="scanner-track">
            <span class="scanner-seg"></span>
            <span class="scanner-seg"></span>
            <span class="scanner-seg"></span>
            <span class="scanner-seg"></span>
            <span class="scanner-seg"></span>
            <span class="scanner-seg"></span>
            <span class="scanner-seg"></span>
            <span class="scanner-seg"></span>
            <span class="scanner-seg"></span>
            <span class="scanner-seg"></span>
            <span class="scanner-seg"></span>
            <span class="scanner-seg"></span>
            <span class="scanner-seg"></span>
            <span class="scanner-seg"></span>
            <span class="scanner-seg"></span>
            <span class="scanner-seg"></span>
            <span class="scanner-seg"></span>
            <span class="scanner-seg"></span>
            <span class="scanner-seg"></span>
            <span class="scanner-seg"></span>
          </div>
          <span class="scanner-bracket">]</span>
        </div>

        <!-- Return CTA -->
        <a href="index.html" class="btn-back" id="btnBack">
          <span class="btn-arrow">←</span>
          <span>Quay lại Portfolio</span>
        </a>
      </div>
    </div>
  </div>

  <script>
    /* ── Live HUD Clock ───────────────────────────────── */
    function updateClock() {
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      const timeStr = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      const clockEl = document.getElementById('hud-clock');
      if (clockEl) {
        clockEl.textContent = `${timeStr} UTC+7 // LIVE`;
      }
    }
    setInterval(updateClock, 1000);
    updateClock();

    /* ── Custom Cursor ────────────────────────────────── */
    const cur = document.getElementById('cursor');
    const ring = document.getElementById('cursor-ring');
    let mx = window.innerWidth / 2, my = window.innerHeight / 2;
    let rx = mx, ry = my;

    window.addEventListener('mousemove', e => {
      mx = e.clientX;
      my = e.clientY;
    });

    function animCursor() {
      if (cur && ring) {
        cur.style.left = mx + 'px';
        cur.style.top = my + 'px';
        rx += (mx - rx) * 0.16;
        ry += (my - ry) * 0.16;
        ring.style.left = rx + 'px';
        ring.style.top = ry + 'px';
      }
      requestAnimationFrame(animCursor);
    }
    animCursor();

    /* ── 3D Card Spotlight & Tilt ─────────────────────── */
    const card = document.getElementById('card');
    const spotlight = document.getElementById('spotlight');

    if (card && spotlight && window.matchMedia('(hover: hover)').matches) {
      document.addEventListener('mousemove', e => {
        const rect = card.getBoundingClientRect();
        const cardX = e.clientX - rect.left;
        const cardY = e.clientY - rect.top;

        spotlight.style.setProperty('--spot-x', `${cardX}px`);
        spotlight.style.setProperty('--spot-y', `${cardY}px`);

        // Subtle 3D tilt
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        const deltaX = (e.clientX - centerX) / (window.innerWidth / 2);
        const deltaY = (e.clientY - centerY) / (window.innerHeight / 2);

        const tiltX = -deltaY * 5;
        const tiltY = deltaX * 7;

        card.style.transform = `rotateX(${tiltX.toFixed(2)}deg) rotateY(${tiltY.toFixed(2)}deg)`;
      });

      document.addEventListener('mouseleave', () => {
        card.style.transform = 'rotateX(0deg) rotateY(0deg)';
      });
    }

    /* ── Interactive Particle Mesh Background ──────────── */
    (function () {
      const canvas = document.getElementById('ambient-canvas');
      const ctx = canvas.getContext('2d');
      let w, h;
      let particles = [];
      const PARTICLE_COUNT = 45;
      const CONNECT_DIST = 120;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      class Particle {
        constructor() {
          this.reset(true);
        }
        reset(initial = false) {
          this.x = Math.random() * w;
          this.y = initial ? Math.random() * h : (Math.random() > 0.5 ? 0 : h);
          this.vx = (Math.random() - 0.5) * 0.55;
          this.vy = (Math.random() - 0.5) * 0.55;
          this.radius = Math.random() * 1.6 + 0.8;
          this.baseAlpha = Math.random() * 0.45 + 0.25;
          this.alpha = this.baseAlpha;
        }
        update() {
          this.x += this.vx;
          this.y += this.vy;

          if (this.x < 0 || this.x > w) this.vx = -this.vx;
          if (this.y < 0 || this.y > h) this.vy = -this.vy;

          // Mouse proximity reaction
          const dx = mx - this.x;
          const dy = my - this.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 130) {
            const force = (130 - dist) / 130;
            this.x -= (dx / dist) * force * 1.5;
            this.y -= (dy / dist) * force * 1.5;
            this.alpha = Math.min(0.9, this.baseAlpha + 0.35);
          } else {
            this.alpha = this.baseAlpha;
          }
        }
        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(0, 245, 255, ${this.alpha})`;
          ctx.shadowBlur = 8;
          ctx.shadowColor = 'rgba(0, 245, 255, 0.4)';
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      }

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles.push(new Particle());
      }

      function drawMesh() {
        ctx.clearRect(0, 0, w, h);

        // Draw connections
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < CONNECT_DIST) {
              const lineAlpha = (1 - dist / CONNECT_DIST) * 0.16;
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = `rgba(56, 189, 248, ${lineAlpha})`;
              ctx.lineWidth = 0.8;
              ctx.stroke();
            }
          }
        }

        // Draw particles
        particles.forEach(p => {
          p.update();
          p.draw();
        });

        requestAnimationFrame(drawMesh);
      }
      drawMesh();
    })();

    /* ── Sci-Fi Micro Sound FX (Web Audio API) ────────── */
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playCyberBeep(freq = 900, duration = 0.04) {
      try {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.5, audioCtx.currentTime + duration);

        gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) { }
    }

    const btnBack = document.getElementById('btnBack');
    if (btnBack) {
      btnBack.addEventListener('mouseenter', () => playCyberBeep(850, 0.03));
      btnBack.addEventListener('click', () => playCyberBeep(1200, 0.06));
    }
  </script>
</body>

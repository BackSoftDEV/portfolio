<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sớm Ra Mắt | Dự Án Cá Nhân · BackDEV</title>
  <meta name="description" content="Dự án cá nhân đang phát triển. Sớm ra mắt trong thời gian tới." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    :root {
      --bg: #070b14;
      --card: rgba(12, 19, 34, 0.75);
      --border: rgba(56, 189, 248, 0.16);
      --neon: #00f5ff;
      --neon2: #3b82f6;
      --amber: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      overflow: hidden;
      position: relative;
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(0, 245, 255, 0.08) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(37, 99, 235, 0.06) 0%, transparent 50%),
        radial-gradient(circle at 20% 80%, rgba(245, 158, 11, 0.04) 0%, transparent 50%);
    }

    /* Ambient Canvas */
    #ambient-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* Minimal Card Container */
    .coming-card {
      position: relative;
      z-index: 1;
      max-width: 620px;
      width: 100%;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 3.8rem 2.4rem;
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.6rem;
      animation: floatUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes floatUp {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.28);
      border-radius: 99px;
      padding: 0.4rem 1.1rem;
      color: #fbbf24;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      background: #f59e0b;
      border-radius: 50%;
      animation: pulseGlow 1.6s infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.6); }
      50% { box-shadow: 0 0 0 6px rgba(245, 158, 11, 0); }
    }

    /* Main Big Title */
    .title {
      font-size: clamp(2.8rem, 7vw, 4.2rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      background: linear-gradient(135deg, #ffffff 30%, var(--neon) 80%, var(--neon2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Subtitle */
    .subtitle {
      font-size: clamp(0.95rem, 2vw, 1.1rem);
      color: var(--text-muted);
      line-height: 1.65;
      max-width: 440px;
    }

    /* Minimal Progress Line */
    .progress-bar-wrap {
      width: 180px;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      overflow: hidden;
      margin: 0.5rem 0;
    }

    .progress-bar {
      height: 100%;
      width: 50%;
      background: linear-gradient(90deg, var(--amber), var(--neon));
      border-radius: 99px;
      animation: loadShift 2s ease-in-out infinite alternate;
    }

    @keyframes loadShift {
      from { transform: translateX(-40%); width: 30%; }
      to { transform: translateX(180%); width: 45%; }
    }

    /* Back Button */
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 0.75rem 1.8rem;
      border-radius: 99px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      margin-top: 0.5rem;
    }

    .btn-back:hover {
      background: rgba(0, 245, 255, 0.12);
      border-color: var(--neon);
      color: var(--neon);
      transform: translateY(-2px);
      box-shadow: 0 0 24px rgba(0, 245, 255, 0.25);
    }

    /* Footer Note */
    .footer-note {
      position: absolute;
      bottom: 1.5rem;
      font-size: 0.78rem;
      color: rgba(148, 163, 184, 0.5);
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>

  <!-- Minimal Ambient Star Canvas -->
  <canvas id="ambient-canvas"></canvas>

  <div class="coming-card">
    <div class="badge">
      <span class="pulse-dot"></span>
      <span>DỰ ÁN CÁ NHÂN ĐANG PHÁT TRIỂN</span>
    </div>

    <h1 class="title">Sớm Ra Mắt</h1>

    <p class="subtitle">
      Website đang trong quá trình xây dựng và hoàn thiện. Tính năng sẽ sớm được phát hành!
    </p>

    <div class="progress-bar-wrap">
      <div class="progress-bar"></div>
    </div>

    <a href="index.html" class="btn-back">
      <span>← Quay lại Portfolio</span>
    </a>
  </div>

  <div class="footer-note">
    BackDEV · Personal Project
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('ambient-canvas');
      const ctx = canvas.getContext('2d');
      let w, h;
      let stars = [];

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      for (let i = 0; i < 40; i++) {
        stars.push({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 1.5 + 0.5,
          alpha: Math.random() * 0.6 + 0.2,
          speed: Math.random() * 0.008 + 0.003
        });
      }

      function draw() {
        ctx.clearRect(0, 0, w, h);
        stars.forEach(s => {
          s.alpha += s.speed;
          if (s.alpha > 0.8 || s.alpha < 0.2) s.speed = -s.speed;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(0, 245, 255, ${Math.max(0, s.alpha)})`;
          ctx.fill();
        });
        requestAnimationFrame(draw);
      }
      draw();
    })();
  </script>
</body>
</html>
